<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alter - Redirecting...</title>
  <meta name="description" content="Redirection d'application Alter Web.">
  <link rel="canonical" href="https://app.alter-evm.com/404.html">
  <meta property="og:site_name" content="Alter Web">
  <meta property="og:title" content="Alter Web">
  <meta property="og:description" content="Redirection d'application Alter Web.">
  <meta property="og:image" content="https://app.alter-evm.com/og-image.jpg">
  <meta name="twitter:card" content="summary">

  <!-- GitHub Pages SPA redirect hack -->
  <script>
    // Capture the current path and store it for index.html to restore
    sessionStorage.redirect = location.href;
  </script>

  <!-- Immediate redirect to index.html -->
  <meta http-equiv="refresh" content="0;URL='/'">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Redirection en cours...</p>
  </div>
</body>
</html>
